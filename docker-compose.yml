
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - laravel
        ports:
            - "3000:3000"
        command: /bin/sh -c "npm run dev & php-fpm"  # Запуск npm run dev и php-fpm одновременно

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
        depends_on:
            - app
        networks:
            - laravel

    db:
        image: mysql:8.0
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: dev_meeper
            MYSQL_USER: root
            MYSQL_PASSWORD: root
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - "3306:3306"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "8080:80"
        links:
            - 'db:db'


    artisan:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/var/www
        entrypoint: [ "php", "/var/www/artisan" ]
        depends_on:
            - db
        networks:
            - laravel

networks:
    laravel:

volumes:
    mysql_data:
